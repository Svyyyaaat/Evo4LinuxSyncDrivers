# Audient EVO4: ignore USB mixer write errors from the firmware.
#
# The EVO4 rejects some SET_CUR requests on its output Feature Unit (e.g. the
# -127 dB minimum on the internal channels 3/4). Kernels 7.2+ (and recent
# 6.12/6.18 LTS) return that error to PipeWire, which then re-applies the
# volume in software (too quiet, L/R mismatch, drifting volume). Same flag the
# kernel already sets for the Audient iD14. Needs kernel >= 6.18.
options snd_usb_audio quirk_flags=2708:0006:IGNORE_CTL_ERROR
