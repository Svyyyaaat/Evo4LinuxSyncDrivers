# Based on alsa-ucm-conf USB-Audio/Audient/Audient-EVO4-HiFi-0006.conf.
#
# The only functional change is the "Headphones" mixer: the EVO4 output
# volume (USB Feature Unit 10) is published by snd-usb-audio as
# "EVO4  Playback Volume" (two spaces), i.e. simple mixer element 'EVO4 '
# with a trailing space. Nothing matches that name automatically, so PipeWire
# falls back to software volume. Naming it in PlaybackMixerElem makes PipeWire
# drive the hardware volume and follow the knob (the kernel sends change
# events for it).
#
# No ctl remap here on purpose: knob change events didn't reach PipeWire
# through the alsa-lib remap plugin.

Include.pcm_split.File "/common/pcm/split.conf"

# Kernels with the upstream EVO4 mixer quirks (Sep 2026) call it "Master".
Define.Evo4OutElem "'EVO4 '"
If.evo4_master {
	Condition {
		Type ControlExists
		Control "name='Master Playback Volume'"
	}
	True.Define.Evo4OutElem "Master"
}

Macro [
	{
		SplitPCM {
			Name "evo4_stereo_out"
			Direction Playback
			Channels 2
			HWChannels 4
			HWChannelPos0 FL # Main Output L
			HWChannelPos1 FR # Main Output R
			HWChannelPos2 FL # Loopback L
			HWChannelPos3 FR # Loopback R
		}
	}
	{
		SplitPCM {
			Name "evo4_mono_in"
			Direction Capture
			Channels 1
			HWChannels 4
			HWChannelPos0 MONO # Mic 1 / Line 1 / Instrument
			HWChannelPos1 MONO # Mic 2 / Line 2
			HWChannelPos2 MONO # Loopback L
			HWChannelPos3 MONO # Loopback R
		}
	}
	{
		SplitPCM {
			Name "evo4_stereo_in"
			Direction Capture
			Channels 2
			HWChannels 4
			HWChannelPos0 FL # Mic 1 / Line 1 / Instrument
			HWChannelPos1 FR # Mic 2 / Line 2
			HWChannelPos2 FL # Loopback L
			HWChannelPos3 FR # Loopback R
		}
	}
]

SectionDevice."Headphones" {
	Comment "Headphone / Line Out"
	Value {
		PlaybackPriority 200
		PlaybackMixerElem "${var:Evo4OutElem}"
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_stereo_out"
		Direction Playback
		HWChannels 4
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line1" {
	Comment "Loopback"
	Value {
		PlaybackPriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_stereo_out"
		Direction Playback
		HWChannels 4
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Loopback"
	Value {
		CapturePriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_stereo_in"
		Direction Capture
		HWChannels 4
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Mic1" {
	Comment "Mic 1 / Line 1 / Instrument"
	Value {
		CapturePriority 200
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_mono_in"
		Direction Capture
		HWChannels 4
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Mic2" {
	Comment "Mic 2 / Line 2"
	Value {
		CapturePriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_mono_in"
		Direction Capture
		HWChannels 4
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}
