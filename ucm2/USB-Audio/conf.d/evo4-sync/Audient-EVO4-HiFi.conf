# Based on alsa-ucm-conf USB-Audio/Audient/Audient-EVO4-HiFi-0006.conf.
#
# The only functional change is the "Headphones" mixer: the EVO4 output
# volume (USB Feature Unit 10) is published by snd-usb-audio as
# "EVO4  Playback Volume" (two spaces, 4 channels). PipeWire can't match
# that name, so it falls back to software volume and the knob/LED ring never
# move. We remap it to a 2-channel "Main Output Playback Volume" (hardware
# channels 0/1 only - channels 2/3 are internal and reject writes) and point
# PipeWire at it, so wpctl, media keys, Waybar etc. drive the real hardware
# volume and the physical knob is reflected back.

Include.pcm_split.File "/common/pcm/split.conf"
Include.ctl_remap.File "/common/ctl/remap.conf"

# Stock kernels: "EVO4  Playback Volume". Kernels with the upstream EVO4
# mixer quirks (merged for the sound tree in Sep 2026) call it "Master".
Define.Evo4OutSrc "EVO4  Playback"
If.evo4_master {
	Condition {
		Type ControlExists
		Control "name='Master Playback Volume'"
	}
	True.Define.Evo4OutSrc "Master Playback"
}

LibraryConfig.pcm.SubstiConfig.ctl.default.map {
	"name='Main Output Playback Volume'"."name='${var:Evo4OutSrc} Volume'" {
		vindex.0 0
		vindex.1 1
	}
}

# Hardware mute only exists with the upstream mixer quirks.
If.evo4_mute {
	Condition {
		Type ControlExists
		Control "name='${var:Evo4OutSrc} Switch'"
	}
	True.LibraryConfig.pcm.SubstiConfig.ctl.default.map {
		"name='Main Output Playback Switch'"."name='${var:Evo4OutSrc} Switch'" {
			vindex.0 0
		}
	}
}

Macro [
	{
		SplitPCM {
			Name "evo4_stereo_out"
			Direction Playback
			Channels 2
			HWChannels 4
			HWChannelPos0 FL # Main Output L
			HWChannelPos1 FR # Main Output R
			HWChannelPos2 FL # Loopback L
			HWChannelPos3 FR # Loopback R
		}
	}
	{
		SplitPCM {
			Name "evo4_mono_in"
			Direction Capture
			Channels 1
			HWChannels 4
			HWChannelPos0 MONO # Mic 1 / Line 1 / Instrument
			HWChannelPos1 MONO # Mic 2 / Line 2
			HWChannelPos2 MONO # Loopback L
			HWChannelPos3 MONO # Loopback R
		}
	}
	{
		SplitPCM {
			Name "evo4_stereo_in"
			Direction Capture
			Channels 2
			HWChannels 4
			HWChannelPos0 FL # Mic 1 / Line 1 / Instrument
			HWChannelPos1 FR # Mic 2 / Line 2
			HWChannelPos2 FL # Loopback L
			HWChannelPos3 FR # Loopback R
		}
	}
]

SectionDevice."Headphones" {
	Comment "Headphone / Line Out"
	Value {
		PlaybackPriority 200
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "Main Output"
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_stereo_out"
		Direction Playback
		HWChannels 4
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line1" {
	Comment "Loopback"
	Value {
		PlaybackPriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_stereo_out"
		Direction Playback
		HWChannels 4
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Line2" {
	Comment "Loopback"
	Value {
		CapturePriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_stereo_in"
		Direction Capture
		HWChannels 4
		Channels 2
		Channel0 2
		Channel1 3
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

SectionDevice."Mic1" {
	Comment "Mic 1 / Line 1 / Instrument"
	Value {
		CapturePriority 200
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_mono_in"
		Direction Capture
		HWChannels 4
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

SectionDevice."Mic2" {
	Comment "Mic 2 / Line 2"
	Value {
		CapturePriority 100
	}
	Macro.pcm_split.SplitPCMDevice {
		Name "evo4_mono_in"
		Direction Capture
		HWChannels 4
		Channels 1
		Channel0 1
		ChannelPos0 MONO
	}
}
