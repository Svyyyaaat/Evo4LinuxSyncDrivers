# Audient EVO4 (2708:0006) - hardware volume sync override
#
# Included by /usr/share/alsa/ucm2/USB-Audio/USB-Audio.conf (alsa-ucm-conf
# >= 1.2.15) after the stock device table, so it replaces the stock EVO4
# profile. See README.md in Evo4LinuxSyncDrivers.

Define.ProfileName "conf.d/evo4-sync/Audient-EVO4"

# Turns on the alsa-lib "remap" ctl plugin (lib/card-init.conf +
# lib/ctl-remap.conf) that the profile uses to expose the volume control
# under a usable name.
Define.MixerRemap "yes"
